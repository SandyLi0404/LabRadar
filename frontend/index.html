<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LabRadar — Columbia CS</title>
<link rel="icon" href="static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="static/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap">
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <h1><img class="logo" src="static/icon.svg" alt="" width="44" height="44">LabRadar</h1>
    <p class="scope">
      Only research professors are listed. Lecturers and teaching professors are
      excluded, following the department directory's own titles.
    </p>
  </div>
</header>

<main class="wrap">
  <div class="viewswitch" role="tablist" aria-label="View">
    <button type="button" id="viewPeople" class="tab" role="tab" aria-selected="true">Professors</button>
    <button type="button" id="viewLabs" class="tab" role="tab" aria-selected="false">Research groups</button>
  </div>

  <section class="controls" aria-label="Filters">
    <div class="row">
      <label class="field grow">
        <span class="label">Search</span>
        <input type="search" id="q" placeholder="name, interest, or area…" autocomplete="off">
      </label>
      <label class="field">
        <span class="label">Sort by</span>
        <select id="sort">
          <option value="name">Name</option>
          <option value="works_since">Recent papers</option>
          <option value="last_pub_year">Most recent publication</option>
        </select>
      </label>
    </div>

    <div class="field">
      <span class="label">Research area</span>
      <div id="areas" class="chips" role="group" aria-label="Research areas"></div>
    </div>

    <div class="row toggles">
      <label class="check">
        <input type="checkbox" id="includeInactive">
        <span>Show professors with no recent papers</span>
      </label>
      <label class="check">
        <input type="checkbox" id="includeNoWebsite">
        <span>Show professors with no website yet</span>
      </label>
      <label class="check">
        <input type="checkbox" id="includeDeparted">
        <span>Show people no longer in the directory</span>
      </label>
    </div>
  </section>

  <div class="statusbar">
    <span id="count" class="count">Loading…</span>
    <button type="button" id="reset" class="linkish">Reset filters</button>
  </div>

  <section id="results" class="results" aria-live="polite"></section>
  <section id="labResults" class="results" aria-live="polite" hidden></section>

  <nav class="pager" id="pager" hidden>
    <button type="button" id="prev">← Previous</button>
    <span id="pageInfo"></span>
    <button type="button" id="next">Next →</button>
  </nav>
</main>

<script src="static/app.js"></script>
</body>
</html>
